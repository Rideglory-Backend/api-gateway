version: '3.8'

services:
  gateway-db:
    container_name: gateway-db
    image: postgres:16.2
    restart: always
    volumes:
      - ./postgress:/var/lib/postgresql/data
    ports:
      - 5434:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=gateway
